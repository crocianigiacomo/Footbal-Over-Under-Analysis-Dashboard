name: Aggiornamento DB Calcio

on:
  schedule:
    # Esegue lo script ogni giorno alle 04:00 del mattino (orario italiano / 03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: # Questo ti permette di avere un tasto "Run" per avviarlo a mano se serve

jobs:
  update-db:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Assicurati che sia compatibile con il tuo codice

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo Scraper
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scrapplusdb.py

      - name: Commit e Push del DB
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add calcio.db
          # Fai il commit solo se calcio.db è cambiato davvero
          git commit -m "🤖 Auto-update: Aggiornato calcio.db con i nuovi risultati" || echo "Nessuna modifica da salvare"
          git pull --rebase origin main
          git push
