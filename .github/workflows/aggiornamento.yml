name: Aggiornamento DB Calcio

on:
  schedule:
    # Esegue lo script ogni giorno alle 04:00 del mattino (orario italiano / 03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: 

jobs:
  update-db:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          # Importante: scarica tutta la cronologia per evitare conflitti di rebase
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo Scraper
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scrapplusdb.py

      - name: Commit e Push del DB
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. Rimuoviamo i file temporanei di SQLite e la cache di Python per pulire Git
          rm -f calcio.db-wal calcio.db-shm
          find . -type d -name "__pycache__" -exec rm -rf {} +
          
          # 2. Proviamo ad aggiungere solo il database
          git add calcio.db
          
          # 3. Verifichiamo se ci sono cambiamenti effettivi
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata nel database. Esco."
            exit 0
          fi
          
          # 4. Facciamo il commit
          git commit -m "🤖 Auto-update: Aggiornato calcio.db con i nuovi risultati"
          
          # 5. Strategia di Pull sicura: se qualcuno ha pushato modifiche al codice (es. dashboard.py), 
          # le integriamo prima di caricare il nuovo DB
          git pull --rebase origin main
          
          # 6. Invio finale
          git push
