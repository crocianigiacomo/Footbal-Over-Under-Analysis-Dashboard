name: Aggiornamento DB Calcio

on:
  schedule:
    # Esegue lo script ogni giorno alle 04:00 italiane (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: # Permette l'avvio manuale dal pannello Actions

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          # Scarica l'intera cronologia per gestire meglio i rebase
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" #

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt #

      - name: Esegui lo Scraper
        env:
          # Recupera la chiave dai Secrets impostati su GitHub
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scrapplusdb.py #

      - name: Commit e Push del DB
        run: |
          # Configurazione utente Bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 1. Rimuove file temporanei SQLite e cache per evitare errori di Git
          rm -f calcio.db-wal calcio.db-shm
          find . -type d -name "__pycache__" -exec rm -rf {} +

          # 2. Aggiunge solo il file del database
          git add calcio.db

          # 3. Verifica se ci sono state nuove partite aggiunte
          if git diff --staged --quiet; then
            echo "Nessun nuovo dato rilevato. Termino il workflow."
            exit 0
          fi

          # 4. Crea il commit
          git commit -m "🤖 Auto-update: Aggiornato calcio.db con i nuovi risultati"

          # 5. Prova il push. Se fallisce (es. modifiche al codice da web), fa il pull e riprova
          git push || (git pull --rebase origin main && git push)
